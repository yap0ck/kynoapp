version: '3.8'
networks:
  kynoapp:

volumes:
  data:

services:

  db:
    container_name: chenil
    image: "postgres:latest"
    environment:
      - POSTGRES_PASSWORD=Test1234
      - POSTGRES_USER=Moi
      - POSTGRES_DB=caninecompanion
    ports:
      - '5432:5432'
    networks:
      - kynoapp
    volumes:
      - data:/var/lib/postgresql/data

  backend:
    container_name: ally
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - kynoapp
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kynoapp
      - POSTGRES_USERNAME=Moi
      - POSTGRES_PASSWORD=Test1234
      - DATA_INIT=false
      - CORS=* #http://frontend:80,

