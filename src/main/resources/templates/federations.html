<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">
<head>
    <meta charset="UTF-8">
    <title>KynoApp</title>
</head>
<body>
<h1>Federation List</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Country</th>
        <th>url</th>
    </tr>
    <tr th:each="federation: ${federations}">
        <td th:text = "${federation.id}"></td>
        <td th:text = "${federation.name}"></td>
        <td th:text = "${federation.country}"></td>
        <td th:text = "${federation.url}"></td>
    </tr>
</table>
</body>
</html>
